name: container-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Run container tests
        run: sudo -E make container-test
